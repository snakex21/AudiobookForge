name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $line = Get-Content version.py | Where-Object { $_ -match '__version__\s*=\s*"([^"]+)"' }
          if ("v$($Matches[1])" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version.py ($($Matches[1]))" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # build_release.bat -> build_installer.bat -> build_folder.bat, which runs
      # scripts\fetch_ffmpeg.ps1 (pinned LGPL ffmpeg, archive + exe SHA-256 checked).
      - name: Build onedir, installer, portable zip and SHA256SUMS
        shell: cmd
        env:
          SKIP_PIP: "1"
          NO_PAUSE: "1"
        run: build_release.bat

      - name: Check bundled ffmpeg
        shell: pwsh
        run: |
          & dist\AudiobookForge\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "bundled ffmpeg does not run" }
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AudiobookForge-release
          path: |
            release/AudiobookForgeSetup.exe
            release/AudiobookForge-*-win64-portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/releases/$($tag.TrimStart('v')).md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "AudiobookForge $tag" --notes-file $notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          $assets = @("release/AudiobookForgeSetup.exe", "release/SHA256SUMS.txt") + (Get-ChildItem release/AudiobookForge-*-win64-portable.zip).FullName
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
